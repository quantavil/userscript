<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal Captcha Solver</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f2330; --mute: #646b7d; --line: #e3e6ee; --hover: #f2f4f8; --accent: #4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1f27; --fg: #e8eaf0; --mute: #a0a6b6; --line: #343846; --hover: #282b36; --accent: #8b87ff; } }
  body { margin: 0; width: 260px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  header img { width: 20px; height: 20px; }
  nav { display: flex; flex-direction: column; padding: 6px; }
  button { all: unset; box-sizing: border-box; width: 100%; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--hover); }
  kbd { float: right; color: var(--mute); font: 11px ui-monospace, monospace; }
  [hidden] { display: none !important; }
  #grant { margin: 6px; width: calc(100% - 12px); text-align: center; background: var(--accent); color: #fff; }
  #msg { margin: 0; padding: 0 12px 10px; color: var(--mute); }
  #msg:empty { display: none; }
</style>
</head>
<body>
<header><img src="icon.svg" alt="">Universal Captcha Solver</header>
<button id="grant" hidden>Allow access to websites</button>
<nav>
  <button data-cmd="r">▶ Solve now <kbd>Alt+Shift+S</kbd></button>
  <button data-cmd="c">🎯 Configure this page <kbd>Alt+Shift+C</kbd></button>
  <button data-cmd="g">🧩 Configure image grid</button>
  <button data-cmd="s">⚙ Settings</button>
</nav>
<p id="msg" role="status"></p>
<script src="popup.js"></script>
</body>
</html>
